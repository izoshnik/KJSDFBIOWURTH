<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубические формы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .cube {
            position: absolute;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
        }

        .cube:nth-child(1) {
            top: 20%;
            left: 10%;
            width: 120px;
            height: 120px;
            animation-duration: 25s;
        }

        .cube:nth-child(2) {
            top: 60%;
            left: 80%;
            width: 80px;
            height: 80px;
            animation-duration: 15s;
        }

        .cube:nth-child(3) {
            top: 40%;
            left: 50%;
            width: 150px;
            height: 150px;
            animation-duration: 30s;
        }

        .cube:nth-child(4) {
            top: 80%;
            left: 20%;
            width: 60px;
            height: 60px;
            animation-duration: 12s;
        }

        .cube:nth-child(5) {
            top: 10%;
            left: 70%;
            width: 100px;
            height: 100px;
            animation-duration: 18s;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
        }

        .front  { transform: rotateY(0deg) translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }

        @keyframes rotate {
            from { transform: rotateX(0) rotateY(0) rotateZ(0); }
            to { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        .floating-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
            opacity: 0.8;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="floating-text">Кубические формы</div>
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <script>
        // Добавляем интерактивность - кубы следуют за курсором
        document.addEventListener('mousemove', (e) => {
            const cubes = document.querySelectorAll('.cube');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            cubes.forEach((cube, index) => {
                const speed = 0.0005 * (index + 1);
                const x = (mouseX - 0.5) * speed * window.innerWidth;
                const y = (mouseY - 0.5) * speed * window.innerHeight;
                
                cube.style.transform += ` translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
